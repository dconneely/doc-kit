# Hygiene hooks for a repository that is entirely prose. Run with `prek` (no Python needed) or
# `pre-commit`.
#
# Infrastructure, not product (ADR-0005): never copied into an adopting repository. Revisions are
# pinned to versions known to work on Windows.
#
# Without this, `install` wires only the pre-commit stage and the commit-msg hook never runs.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # `gitleaks-system`, not `gitleaks`: the default builds an unsigned binary with Go, which Windows
  # Smart App Control blocks (os error 4551). Needs gitleaks on PATH.
  #
  # Keep this rev in step with the installed binary: the hook's subcommand differs either side of
  # v8.19.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        # It reads the staged diff itself and rejects more than one path argument.
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # No --markdown-linebreak-ext: nothing here uses trailing-double-space line breaks.
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      # `LICENCE` and `LICENSE` would collide silently on a case-insensitive filesystem.
      - id: check-case-conflict
      - id: check-shebang-scripts-are-executable
      # Guards .gitattributes' eol=lf against being weakened.
      - id: mixed-line-ending
        args: [--fix=lf]

  # The owner's shared hooks. format-markdown (Prettier) and lint-markdown (markdownlint-cli2) carry
  # their own config: prose wrapped at 100 columns, and markdownlint's full default ruleset, so
  # templates copied from this kit already pass an adopter's linter. Prettier rewrites `*emphasis*`
  # to `_emphasis_`, with no option to avoid it. format-markdown runs first, since lint-markdown
  # can't fix long lines.
  #
  # lint-commit-msg applies commitlint's Conventional Commits rules unchanged, on commit-msg: a
  # lower-case type from its list and a lower-case subject. `build` covers infrastructure such as
  # this file, alongside AGENTS.md's mapping. It checks a subject's form, not whether the type is
  # right - see docs/testing.md.
  #
  # check-pii rejects personal details in the staged diff and the commit message. Its skips are the
  # owner's name and handle where they belong: the licence, the decisions index's decision-makers
  # column, decision records under their old path, links to the owner's repositories, and a test's
  # made-up address. check-pii-files and check-pii-history run by hand:
  # `prek run --stage manual check-pii-files --all-files`, and the same for check-pii-history.
  - repo: https://github.com/dconneely/hooks
    rev: e9bbf7281329b0bc3d8a3ee3864b932d1f7c2cc4 # frozen: v0.3.0
    hooks:
      - id: lint-commit-msg
      - id: format-markdown
      - id: lint-markdown
      # shellcheck trusts the shebang, so a bash-only construct under #!/bin/sh would pass
      # silently. Bash scripts are welcome, named .bash.
      - id: sh-scripts-are-posix
      - &check-pii
        id: check-pii
        args:
          - --skip-line
          - 'LICENCE:^Copyright [0-9]{4} [A-Z][a-z]+ [A-Z][a-z]+$'
          - --skip-line
          - 'docs/(decisions/README|decisions)\.md:^\| \[ADR-[0-9]{4}\]'
          - --skip-line
          - 'docs/adr/[^/]+\.md:^decision-makers:'
          - --skip-line
          - '(ADOPTING\.md|docs/research/[^/]+\.md|templates/.+\.md):[a-z]+/(doc-kit|play-[a-z]+)([^a-z-]|$)'
          - --skip-line
          - 'tests/doc-kit-eval\.sh:(@AGENTS\.md|user\.email=[a-z]+@example\.invalid)'
      - <<: *check-pii
        id: check-pii-msg
      - <<: *check-pii
        id: check-pii-files
      - <<: *check-pii
        id: check-pii-history

  # Python rather than Docker, for the same reason as gitleaks.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # Link rot, on demand only (`prek run --hook-stage manual lychee-system`): a hook that blocks a
  # commit because someone else's server is down gets bypassed. CI runs the same command nightly.
  #
  # --method get: rfc-editor.org answers HEAD with 500. `lychee-system` needs lychee on PATH; the
  # auto-installing hook mangles Windows paths. Tags are `lychee-vX.Y.Z`, not `vX.Y.Z`.
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee-system
        stages: [manual]
        args: [--no-progress, --method, get, --max-concurrency, "4"]

  # The hooks .pre-commit-hooks.yaml publishes, run locally so each change is checked by the version
  # it makes. Keep them identical to the manifest. `pygrep` fails when a file MATCHES the Python
  # regex in `entry`.
  - repo: local
    hooks:
      - id: doc-kit-check
        name: doc-kit conformance check
        entry: tools/doc-kit-check.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: lowercase-adr-status
        name: "ADR statuses are lowercase (MADR spelling)"
        language: pygrep
        # No `Deprecated`: it is also a Keep a Changelog category. Scoped to docs/decisions/ so prose
        # discussing the convention elsewhere is not flagged.
        entry: 'Superseded by ADR-|`(Accepted|Proposed|Rejected)`'
        files: ^docs/decisions/

      - id: no-nygard-status-section
        name: "Records use MADR front-matter, not a Status section"
        language: pygrep
        entry: '^## Status$'
        files: ^docs/decisions/

      - id: no-template-banner
        name: "Templates carry no instructional banner"
        language: pygrep
        entry: 'This file is a template'
        types: [markdown]
        exclude: ^docs/archive/
