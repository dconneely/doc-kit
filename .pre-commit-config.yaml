# Hygiene hooks for a repository that is entirely prose. Run with `prek` (no Python needed) or
# `pre-commit`. Kept deliberately small: this catches drift, not correctness. The conformance
# checker in PLAN.md is a separate thing and does not exist yet.
#
# This file is infrastructure, not product (ADR-0007) — it configures this repository and is never
# copied into an adopting one. Revisions are pinned to versions known to work on Windows.
repos:
  # Secrets reach Markdown too — a connection string pasted into a research note, an example key
  # left in a template, a token named in a changelog entry about rotating it.
  #
  # `gitleaks-system` rather than the default `gitleaks`, which builds the binary from source with
  # Go: that produces an unsigned, reputation-less executable in AppData, which Windows Smart App
  # Control blocks outright (os error 4551). A packaged release carries enough download reputation
  # to run even with Smart App Control enforced, so this hook works whether or not a given machine
  # has it on. Needs gitleaks on PATH — `scoop install gitleaks`, `brew install gitleaks`, or a
  # release binary.
  #
  # Keep this rev in step with the installed binary. The hook's entry changed from
  # `gitleaks protect` to `gitleaks git --pre-commit` around v8.19, so an old rev driving a new
  # binary invokes a deprecated subcommand.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        # `gitleaks git --staged` reads the staged diff itself and takes at most one path, so
        # passing it the changed filenames makes it exit with "accepts at most 1 arg(s)".
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # No --markdown-linebreak-ext here: this repo has zero trailing-double-space line breaks
      # (checked), so the default behaviour has nothing to eat. Add the flag if that changes.
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      # .gitattributes already pins eol=lf; this guards against that being weakened rather than
      # being the fix for it.
      - id: mixed-line-ending
        args: [--fix=lf]

  # Line-length gate only — see .markdownlint-cli2.jsonc. MD013 has no auto-fix in any markdownlint
  # implementation, so this reports and does not rewrap.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  # Link rot, on demand only: `prek run --hook-stage manual lychee`.
  #
  # Deliberately NOT on commit. External hosts fail for reasons unrelated to the change under
  # review, and a hook that blocks a commit because someone else's server is down is a hook that
  # gets bypassed. Nightly CI is the right home once this repository is published; until then it is
  # a manual sweep.
  #
  # --method get, not the default HEAD: rfc-editor.org answers HEAD with 500 and GET with 200
  # (checked both ways), so a HEAD-based sweep reports two false failures against RFC 2119 and
  # RFC 9457. Other standards bodies are likely to behave the same way.
  # Note the tag prefix: lychee tags releases `lychee-vX.Y.Z`, not `vX.Y.Z`.
  #
  # `lychee-system` needs lychee on PATH — `scoop install lychee`, `brew install lychee` or
  # `cargo install lychee`. The auto-installing `lychee` hook would avoid that, but its install
  # script mangles Windows paths (strips the backslashes, then fails with exit 127), so it is not
  # usable here. Same class of gap as prek's Ruby hooks on Windows.
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee-system
        stages: [manual]
        args: [--no-progress, --method, get, --max-concurrency, "4"]

  # Drift guards. Every defect found in this repository so far has been drift rather than design:
  # a convention changed in one file and not the others. markdownlint catches formatting drift;
  # these catch the semantic kind, which is what actually bit — four separate instances of stale
  # status casing survived three manual reviews before a grep found them.
  #
  # `language: pygrep` is built into pre-commit — a cross-platform grep whose `entry` is a Python
  # regex, failing when a file MATCHES. No install cost. Case-sensitive by default; `(?i)` or
  # `args: [-i]` to relax that, `--multiline` to span lines, `--negate` to require a match instead
  # of forbidding one. prek supports it too (its docs claim every pre-commit language, and offer
  # native deny-pattern/require-pattern equivalents) — both checked against upstream docs.
  #
  # `--negate` is the tool for the checks this cannot yet express: "every record HAS front-matter"
  # rather than "no file has a Status section". Worth reaching for before writing a script.
  - repo: local
    hooks:
      - id: lowercase-adr-status
        name: "ADR statuses are lowercase (MADR spelling)"
        language: pygrep
        # `Deprecated` is deliberately absent: it is also a Keep a Changelog category, so matching
        # it flags three legitimate lines. Verified by running the pattern both ways.
        entry: 'Superseded by ADR-|`(Accepted|Proposed|Rejected)`'
        types: [markdown]

      - id: no-nygard-status-section
        name: "Records use MADR front-matter, not a Status section"
        language: pygrep
        entry: '^## Status$'
        files: ^docs/adr/

      - id: no-template-banner
        name: "Templates carry no instructional banner (ADR-0011)"
        language: pygrep
        entry: 'This file is a template'
        types: [markdown]
