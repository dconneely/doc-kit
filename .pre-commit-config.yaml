# Hygiene hooks for a repository that is entirely prose. Run with `prek` (no Python needed) or
# `pre-commit`. The conformance checker, tools/doc-kit-check.sh, is product and runs separately.
#
# Infrastructure, not product (ADR-0007): never copied into an adopting repository. Revisions are
# pinned to versions known to work on Windows.
#
# Without this, `install` wires only the pre-commit stage and the commit-msg hook never runs.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # `gitleaks-system`, not `gitleaks`: the default builds an unsigned binary with Go, which Windows
  # Smart App Control blocks (os error 4551). Needs gitleaks on PATH.
  #
  # Keep this rev in step with the installed binary - the hook's subcommand changed around v8.19.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        # It reads the staged diff itself and rejects more than one path argument.
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # No --markdown-linebreak-ext: nothing here uses trailing-double-space line breaks.
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      # `LICENCE` and `LICENSE` would collide silently on a case-insensitive filesystem.
      - id: check-case-conflict
      - id: check-shebang-scripts-are-executable
      # Guards .gitattributes' eol=lf against being weakened.
      - id: mixed-line-ending
        args: [--fix=lf]

  # Formatter; markdownlint-cli2 below is the linter. Config is in .prettierrc.json - CLI flags
  # alone wrapped nothing (ADR-0017). `local` because pre-commit/mirrors-prettier is stale.
  # Rewrites `*emphasis*` to `_emphasis_`, with no option to avoid it.
  - repo: local
    hooks:
      - id: prettier-markdown
        name: Prettier (auto-format Markdown)
        language: system
        entry: npx --yes prettier@3.9.6 --write
        pass_filenames: true
        types: [markdown]

  # Config in .markdownlint-cli2.jsonc. Reports only; Prettier does the rewrapping.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  # Python rather than Docker, for the same reason as gitleaks.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # Conventional Commits on commit-msg, with the hook's default type list; `build` covers
  # infrastructure such as this file, alongside AGENTS.md's mapping. Python rather than Node
  # commitlint: nothing compiled, which matters under Smart App Control. It checks a subject's
  # shape, not whether the type is right, and accepts `Feat:` - see docs/testing.md.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Link rot, on demand only (`prek run --hook-stage manual lychee-system`): a hook that blocks a
  # commit because someone else's server is down gets bypassed. CI runs the same command nightly.
  #
  # --method get: rfc-editor.org answers HEAD with 500. `lychee-system` needs lychee on PATH; the
  # auto-installing hook mangles Windows paths. Tags are `lychee-vX.Y.Z`, not `vX.Y.Z`.
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee-system
        stages: [manual]
        args: [--no-progress, --method, get, --max-concurrency, "4"]

  # Drift guards. `pygrep` fails when a file MATCHES the Python regex in `entry`.
  - repo: local
    hooks:
      - id: lowercase-adr-status
        name: "ADR statuses are lowercase (MADR spelling)"
        language: pygrep
        # No `Deprecated`: it is also a Keep a Changelog category. Scoped to docs/adr/ so prose
        # discussing the convention elsewhere is not flagged.
        entry: 'Superseded by ADR-|`(Accepted|Proposed|Rejected)`'
        files: ^docs/adr/

      - id: no-nygard-status-section
        name: "Records use MADR front-matter, not a Status section"
        language: pygrep
        entry: '^## Status$'
        files: ^docs/adr/

      - id: no-template-banner
        name: "Templates carry no instructional banner (ADR-0011)"
        language: pygrep
        entry: 'This file is a template'
        types: [markdown]

      # shellcheck trusts the shebang, so a bash-only construct under #!/bin/sh would pass
      # silently. Bash scripts are welcome, named .bash.
      - id: sh-scripts-are-posix
        name: ".sh scripts must not declare a bash shebang (use .bash for bash-specific scripts)"
        language: pygrep
        entry: '^#!.*\bbash\b'
        files: \.sh$
