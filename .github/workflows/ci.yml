name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Conformance
        run: sh tools/doc-kit-check.sh
      - name: Checker tests
        run: sh tests/doc-kit-check.test.sh

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installed from PyPI, not via j178/prek-action: the repository allows only GitHub-owned,
      # verified-creator and explicitly listed actions.
      - name: Install prek
        run: pipx install prek==0.5.3
      - name: Hooks
        run: prek run --all-files --show-diff-on-failure
        env:
          # Scans only the staged diff, which is empty in CI; it runs on commit locally.
          SKIP: gitleaks-system
