name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  checker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    # Git's bash on Windows: the scripts need a POSIX sh, and PowerShell's PATH may not have one.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Conformance
        run: sh tools/doc-kit-check.sh
      - name: Checker tests
        run: sh tests/doc-kit-check.test.sh
      - name: Duplication advisory
        run: sh tests/doc-kit-duplicate-check.sh
      - name: Word budget
        run: sh tests/doc-kit-word-budget.sh

  # Linux only: the run starts two stub sessions per scenario, which takes a quarter of an hour on
  # Windows.
  eval-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Eval checks against stub agents
        run: sh tests/doc-kit-eval.test.sh

  hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installed from PyPI, not via j178/prek-action: the repository allows only GitHub-owned,
      # verified-creator and explicitly listed actions.
      - name: Install prek
        run: pipx install prek==0.5.3
      - name: Hooks
        run: prek run --all-files --show-diff-on-failure
        env:
          # Each scans only the staged diff, which is empty in CI; they run on commit locally.
          # check-pii's patterns also come from the committer's machine.
          SKIP: gitleaks-system,check-pii
